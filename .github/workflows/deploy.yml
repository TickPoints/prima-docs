# Deploy the stdlib reference site to GitHub Pages.
#
# Triggers:
#   - schedule: poll the latest `prima` release once a day; regenerate and redeploy
#     only when a newer release exists than the stored version stamp.
#   - workflow_dispatch: manual redeploy; `force: true` regenerates even when the
#     latest release matches the stored stamp.
#
# Note: the Pages deployment source must be set to "GitHub Actions" in the repo
# settings (Settings -> Pages -> Build and deployment -> Source -> GitHub Actions).

name: deploy

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even when the version stamp is current'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-docs:
    name: Regenerate and deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate reference pages (skip when version stamp is current)
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            VERSION="$(curl -fsSL "https://api.github.com/repos/TickPoints/prima-language/releases/latest" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
            ./scripts/generate.sh --version "$VERSION"
          else
            ./scripts/check-and-generate.sh
          fi

      - name: Commit regenerated docs
        id: commit
        run: |
          if git diff --quiet -- src/; then
            echo "no doc changes; skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/
            VERSION="$(cat src/generated/version.txt)"
            git commit -m "docs: regenerate stdlib reference for ${VERSION}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build site
        run: mdbook build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
